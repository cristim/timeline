name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        run: go test ./...
      - name: Build web app
        working-directory: web
        env:
          VITE_BASE: /everything-timeline/
        run: |
          npm ci
          npm run build
      - name: Bake artifacts into the site
        run: go run ./cmd/baker bake --seed data/seed --out web/dist
      - name: SPA fallback
        run: cp web/dist/index.html web/dist/404.html
      - name: Install Playwright
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Browser-verify the built site (playwright-verify)
        working-directory: web
        env:
          E2E_STATIC: "1"
          E2E_BASE_URL: http://localhost:4173/everything-timeline/
          VITE_BASE: /everything-timeline/
        run: npx playwright test
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
