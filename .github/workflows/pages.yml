name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  BASEMAP_FILE: protomaps-20260829-z0-6.pmtiles
  BASEMAP_SHA256: 91578880b31e965f7e1c27c3efe1e2f53bb60e87b758349761a5f32cbb37b675
  BASEMAP_SOURCE: https://build.protomaps.com/20260829.pmtiles
  BASEMAP_ATTRIBUTION: >-
    <a href="https://github.com/protomaps/basemaps">Protomaps</a> · © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a> · <a href="https://docs.overturemaps.org/attribution/">© ESA WorldCover project 2020 / Contains modified Copernicus Sentinel data (2020) processed by ESA WorldCover consortium</a> (<a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Borders, paleo coastlines, and the local basemap are derived from pinned
      # upstreams rather than committed. The cache key is a hash of those pins, so an
      # unchanged pin never touches the network and a bumped one refetches
      # without anyone editing a key by hand.
      - name: Geo fingerprint
        id: geofp
        run: echo "key=$(go run ./cmd/baker geo-fingerprint)" >> "$GITHUB_OUTPUT"
      - name: Restore fetched map layers
        id: geocache
        uses: actions/cache@v4
        with:
          path: |
            data/geo/borders
            data/geo/paleo
            data/geo/basemap
          key: geo-${{ steps.geofp.outputs.key }}
      - name: Fetch map layers
        if: steps.geocache.outputs.cache-hit != 'true'
        run: make fetch-geo
      # A half-fetched atlas must never deploy. The bake rejects a layer whose
      # coverage windows do not tile, so this proves the layers are whole
      # before anything downstream trusts them.
      - name: Verify map layer coverage
        run: make verify-geo
      - name: Test
        run: go test ./...
      - name: Build baker image
        run: docker build --tag world-knowledge-baker:pages .
      - name: Build web app
        working-directory: web
        env:
          VITE_BASE: /timeline/
        run: |
          npm ci
          npm run build
      - name: Bake artifacts into the site
        run: docker run --rm --user "$(id -u):$(id -g)" --volume "$PWD/data/seed:/seed:ro" --volume "$PWD/data/geo:/geo:ro" --volume "$PWD/data/goldens.json:/goldens.json:ro" --volume "$PWD/web/dist:/out" world-knowledge-baker:pages bake --seed /seed --geo /geo --goldens /goldens.json --out /out
      - name: Verify published basemap
        run: ./scripts/verify-bake-output.sh web/dist --layers
      - name: SPA fallback
        run: cp web/dist/index.html web/dist/404.html
      - name: Install Playwright
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Browser-verify the built site (playwright-verify)
        working-directory: web
        env:
          E2E_STATIC: "1"
          E2E_BASE_URL: http://localhost:4173/timeline/
          VITE_BASE: /timeline/
        run: npx playwright test
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
