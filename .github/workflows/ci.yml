name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The ingest tests validate the fetched atlas, so ci needs the same
      # fetch-or-cache dance as the pages build.
      - name: Geo fingerprint
        id: geofp
        run: echo "key=$(go run ./cmd/baker geo-fingerprint)" >> "$GITHUB_OUTPUT"
      - name: Restore fetched map layers
        id: geocache
        uses: actions/cache@v4
        with:
          path: |
            data/geo/borders
            data/geo/paleo
          key: geo-${{ steps.geofp.outputs.key }}
      - name: Fetch map layers
        if: steps.geocache.outputs.cache-hit != 'true'
        run: make fetch-geo
      - run: go vet ./...
      - run: go test ./...
      - name: Build baker image
        run: docker build --tag world-knowledge-baker:ci .
      - name: Prepare container bake output
        run: mkdir -m 0777 "$RUNNER_TEMP/bake-out"
      - name: Run baker image
        run: docker run --rm --volume "$PWD/data/seed:/seed:ro" --volume "$PWD/data/geo:/geo:ro" --volume "$PWD/data/goldens.json:/goldens.json:ro" --volume "$RUNNER_TEMP/bake-out:/out" world-knowledge-baker:ci bake --seed /seed --geo /geo --goldens /goldens.json --out /out
      - name: Verify container bake output
        run: test -f "$RUNNER_TEMP/bake-out/manifest.json"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test
